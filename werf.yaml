configVersion: 1
project: sso-service
---
image: build
from: golang:1.26-alpine3.23
git:
  - add: /
    to: /app
    stageDependencies:
      install:
        - "go.mod"
        - "go.sum"
      setup:
        - "**/*.go"
shell:
  install:
    - cd /app && go mod download
  setup:
    - cd /app && GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o /bin/app cmd/main.go
---
image: app
from: gcr.io/distroless/static-debian12:nonroot
import:
  - image: build
    add: /bin/app
    to: /bin/app
    after: setup
imageSpec:
  config:
    cmd:
      - "/bin/app"