services:
  app:
    container_name: app.${APP_NAME}
    build:
      context: .
      dockerfile: .docker/app/Dockerfile
    ports:
      - "${GRPC_PORT}:${GRPC_PORT}"
      - "${DIAGNOSTIC_PORT}:${DIAGNOSTIC_PORT}"
    env_file:
      - .env
    networks:
      - app
    depends_on:
      - mongo

  mongo:
    image: mongo:8.2.5
    container_name: mongo.${APP_NAME}
    ports:
      - "${DB_PORT}:27017"
    networks:
      - app
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
    restart: unless-stopped

  otel:
    container_name: otel.${APP_NAME}
    image: grafana/otel-lgtm:latest
    ports:
      - '${OTEL_GRAFANA_PORT}:3000'
      - '${OTEL_GRPC_PORT}:4317'
    networks:
      - app
    volumes:
      - ./.docker/otel/data:/data
    environment:
      - ENABLE_LOGS_ALL=true
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  app:
    driver: bridge