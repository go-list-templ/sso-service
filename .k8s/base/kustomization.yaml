apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sso-service

resources:
  - job/wait-depends.yaml
  - job/migrate.yaml
  - configmap.yaml
  - deployment.yaml
  - sa.yaml
  - service.yaml

patches:
  - target:
      kind: Deployment
      name: sso-service
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers
        value:
          - name: wait-mongodb
            image: busybox:1.36
            command: ["sh", "-c", "until nc -w 2 $(DB_HOST) $(DB_PORT); do echo Waiting...; sleep 2; done;"]
            envFrom:
              - configMapRef:
                  name: sso-service-config
          - name: run-migrations
            image: sso-service-image
            command: ["/migrations/migrate", "-path=/migrations/schemes", "-database=mongodb://$(DB_USERNAME):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)?sslmode=disable", "up"]
            envFrom:
              - configMapRef:
                  name: sso-service-config