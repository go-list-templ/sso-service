apiVersion: apps/v1
kind: Deployment
metadata:
  name: sso-service
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sso-service
  template:
    metadata:
      labels:
        app: sso-service
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "sso-service-role"
        vault.hashicorp.com/agent-inject-secret-key-version.txt: "transit/keys/sso-service-keys"
        vault.hashicorp.com/agent-inject-template-key-version.txt: |
          {{ with secret "transit/keys/sso-service-keys" }}
          {{ .Data.latest_version }}
          {{ end }}
    spec:
      serviceAccountName: sso-service-sa
      containers:
        - name: sso-service
          image: sso-service-image
          ports:
            - name: grpc
              containerPort: 8080
              protocol: TCP
            - name: http
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 3
            failureThreshold: 20
          env:
            - name: APP_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: sso-service-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"